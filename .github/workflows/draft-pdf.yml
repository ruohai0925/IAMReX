name: Draft PDF
on:
  push:
    # Restricted to branches: on a tag push the checkout is in detached HEAD
    # state, so the "Commit PDF to repository" step below cannot push and the
    # whole workflow fails.
    branches:
      - development
    paths:
      - JOSS_paper/**
      - .github/workflows/draft-pdf.yml


jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build draft PDF
        # Pinned to the master commit current as of this change, since the action
        # has no tag newer than v1.0 (2024-07-17); @master would float untested.
        uses: openjournals/openjournals-draft-action@af22ceb4b8f9eff6b3a13c05747ccc2f573cf2e6
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: JOSS_paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: JOSS_paper/paper.pdf
      - name: Commit PDF to repository
        uses: EndBug/add-and-commit@v9
        with:
          message: '(auto) Paper PDF Draft'
          add: 'JOSS_paper/paper.pdf'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}